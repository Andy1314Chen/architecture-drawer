" stroke="#78909C" stroke-width="2" fill-opacity="1"  /><text  x="1600" y="548" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >⑤ 在轨软件更新</text><text  x="1600" y="563" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >(OTA)</text><circle  cx="900" cy="445" r="5" fill="#78909C" stroke="none" stroke-width="1" fill-opacity="1"  /><line x1="900.0" y1="417" x2="900.0" y2="438.5" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="290.0" y1="417" x2="898.5010651100984" y2="439.9434827828398" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="1510.0" y1="417" x2="901.4989348899016" y2="439.9434827828398" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="450" x2="201.49938812969106" y2="469.9571603391517" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="450" x2="551.497557001636" y2="469.9144253141922" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="450" x2="900.0" y2="468.5" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="450" x2="1248.5024429983641" y2="469.9144253141922" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="450" x2="1598.500611870309" y2="469.9571603391517" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><rect  x="60" y="675" width="790" height="220" rx="6" ry="5" fill="#FFFFFF" stroke="#78909C" stroke-width="2" fill-opacity="1"  /><text  x="455" y="700" font-family="Arial, sans-serif" font-size="14" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >多目标评估器</text><text  x="80" y="730" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 故障注入 (辐射效应模拟)</text><text  x="80" y="748" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 性能监测 (延迟/吞吐量)</text><text  x="80" y="766" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 功耗测量 (电流/电压采样)</text><rect  x="950" y="675" width="790" height="220" rx="6" ry="5" fill="#FFFFFF" stroke="#78909C" stroke-width="2" fill-opacity="1"  /><text  x="1345" y="700" font-family="Arial, sans-serif" font-size="14" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >设计空间探索引擎</text><text  x="970" y="730" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 贝叶斯优化 / 多目标进化算法</text><text  x="970" y="748" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 帕累托排序</text><text  x="970" y="766" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 约束边界搜索</text><line x1="200.0" y1="640" x2="453.5139326305934" y2="674.7960299689049" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="550.0" y1="640" x2="456.4075146752257" y2="674.481441961759" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="900.0" y1="640" x2="456.49538184949" y2="674.8823856972311" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="1250.0" y1="640" x2="456.49854844887057" y2="674.9340261689176" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="1600.0" y1="640" x2="456.49929970316936" y2="674.954169878069" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)"  /><line x1="850" y1="785.0" x2="948.0" y2="785.0" stroke="#78909C" stroke-width="2" marker-end="url(#arrowhead)"  /><circle  cx="1770" cy="785" r="8" fill="#E65100" stroke="none" stroke-width="1" fill-opacity="1"  /><line x1="1740" y1="785.0" x2="1760.0" y2="785.0" stroke="#E65100" stroke-width="2" marker-end="url(#arrowhead_fb)"  /><circle  cx="1770" cy="322" r="8" fill="#E65100" stroke="none" stroke-width="1" fill-opacity="1"  /><line x1="1770.0" y1="777" x2="1770.0" y2="332.0" stroke="#E65100" stroke-width="2" marker-end="url(#arrowhead_fb)" stroke-dasharray="6,3" /><line x1="1762" y1="322.0" x2="1741.5" y2="322.0" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowhead_fb)"  /><circle  cx="1790" cy="172" r="8" fill="#E65100" stroke="none" stroke-width="1" fill-opacity="1"  /><path d="M 1770 785 L 1790 785 L 1790 172" fill="none" stroke="#E65100" stroke-width="2" marker-end="url(#arrowhead_fb)" stroke-dasharray="6,4" /><line x1="1782" y1="172.0" x2="1661.5" y2="172.0" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowhead_fb)"  /><rect  x="60" y="925" width="1150" height="140" rx="5" ry="5" fill="#FFFFFF" stroke="#78909C" stroke-width="1" fill-opacity="1" data-graph-role="decoration"  /><text  x="635" y="947" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >核心数学描述</text><text  x="78" y="973" font-family="monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Minimize   x = [α, β, γ, δ]</text><text  x="78" y="989" font-family="monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >        [ -f_perf(x) ,  -f_rel(x) ,  f_pwr(x) ]</text><text  x="78" y="1005" font-family="monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >Subject to  g_rel(x) ≥ 0.999 ,  P(x) ≤ P_max ,  M(x) ≤ M_max</text><text  x="78" y="1021" font-family="monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" ></text><text  x="78" y="1037" font-family="monospace" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >→ 求解该问题得到帕累托最优配置集</text><rect  x="1240" y="925" width="500" height="140" rx="5" ry="5" fill="#FFFFFF" stroke="#78909C" stroke-width="1" fill-opacity="1" data-graph-role="decoration"  /><text  x="1490" y="947" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >整体逻辑流概述</text><text  x="1254" y="973" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >目标层定义性能↑、可靠≥99.9%、功耗≤P_max三个冲突目标，</text><text  x="1254" y="989" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >其非支配解构成帕累托前沿。目标分解为硬件冗余比α、</text><text  x="1254" y="1005" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >软件校验周期β/δ、协同分配系数γ，由技术实现层承载。</text><text  x="1254" y="1021" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >经评估与优化引擎迭代求解，配置经反馈闭环回传，</text><text  x="1254" y="1037" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >形成持续逼近帕累托边界的自适应循环。</text>
