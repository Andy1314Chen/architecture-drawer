rial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" dominant-baseline="central" font-weight="bold" font-style="normal" data-graph-role="legend">帕累托前沿  (Pareto Frontier)</text><line x1="530" y1="105.0" x2="798.5" y2="105.0" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><line x1="1000" y1="105.0" x2="1268.5" y2="105.0" stroke="#78909C" stroke-width="1.5" marker-end="url(#arrowhead)" stroke-dasharray="6,3" /><rect  x="60" y="227" width="460" height="190" rx="6" ry="5" fill="#E3F2FD" stroke="#78909C" stroke-width="2" fill-opacity="1"  /><text  x="290" y="249" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >软件域 (决策变量 β, δ)</text><text  x="78" y="279" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 算法级容错(ABFT)校验周期</text><text  x="78" y="297" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 检查点保存频率</text><text  x="78" y="315" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 动态重试触发阈值</text><rect  x="670" y="227" width="460" height="190" rx="6" ry="5" fill="#E0F7FA" stroke="#78909C" stroke-width="2" fill-opacity="1"  /><text  x="900" y="249" font-family="Arial, sans-serif" font-size="12" fill="#78909C" text-anchor="middle" dominant-baseline="central" font-weight="bold" font-style="normal" >硬件域 (决策变量 α)</text><text  x="688" y="279" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" dominant-baseline="central" font-weight="normal" font-style="normal" >· 三模冗余(TMR)复制比例</text><text  x="688" y="297" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start" 